precleaner:
  disclaimer_markers:
  - confidentiality notice
  - privacy policy
  - this e-mail is for the intended recipient
  - this message may contain confidential
  - unsubscribe
  - данное электронное сообщение
  - запрещено
  - информация, содержащаяся в данном
  - информация, содержащаяся в настоящем сообщении
  - уведомление о конфиденциальности
  - конфиденциальная информация
  - сообщение содержит конфиденциальную информацию
  - любое рассмотрение, повторная передача
  - может содержать конфиденциальную информацию
  - настоящее сообщение
  - не влечет за собой возникновение
  - не может служить основанием
  - не является договорённостью сторон
  - предназначено только для адресата
  - распространение или иное использование
  - убедительная просьба сохраняйте, пожалуйста, историю переписки
  - не подлежит распространению
  - строго конфиденциально
  fold_on_repeat: true
  fold_quote_over_chars: 1200
  keep_first_disclaimer_per_thread: false
  keep_first_signature_per_sender: true
  languages:
  - ru
  - en
  max_signature_lines: 8
  max_disclaimer_lines: 6
  quote_preview_non_empty_lines: 40
  quote_preview_tail_non_empty_lines: 16
  quote_preview_header_markers:
  - from:
  - to:
  - cc:
  - subject:
  - sent:
  quote_preview_min_lines: 6
  quote_preview_context_lines: 3
  quote_preview_max_chars: 1200
  quote_preview_markers:
  -  пишет
  - wrote:
  - forwarded message
  - original message
  - ответил
  - написал
  sig_markers:
  - --
  - best regards
  - cheers
  - cordially
  - kind regards
  - regards
  - sincerely
  - thank you
  - thanks
  - yours sincerely
  - с наилучшими пожеланиями
  - с уважением
  - с признательностью
  - с почтением
  - —
